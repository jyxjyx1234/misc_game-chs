// *************************************************************
// ■ボタン選択肢の設定
// =============================================================
// ボタン選択肢（selbtn）用の設定です。
//
// =============================================================
// ◆開く / 閉じる / 決定時のアニメモード
//
//    ≪開きアニメタイプ≫
//        0: アニメなし
//        1: フェードイン
//        2: 上から出てくる
//        3: 下から出てくる
//        4: 左から出てくる
//        5: 右から出てくる
//        6: 左右から交互に出てくる
//        7: 一番上の選択肢の位置から散らばるように出てくる（▲未実装）
//        8: 一番上の選択肢の位置から順番に出てくる（▲未実装）
//
//    ≪閉じアニメモード≫
//        0: アニメなし
//        1: フェードアウト
//        2: 上へ消える
//        3: 下へ消える
//        4: 左へ消える
//        5: 右へ消える
//        6: 左右へ交互に消える
//        7: 一番上の選択肢の位置へ集まるように消える（▲未実装）
//        8: 一番上の選択肢から順番に消える（▲未実装）
//
//    ≪決定アニメモード≫
//        0: アニメなし
//        1: 選択した項目以外をフェードで消去
//        2: 選択した項目以外を選択した項目に集まるように消去
//        3: 選択した項目以外を消去（▲未実装）
//
//    ≪閉じアニメモードの注意≫
//        決定アニメモードを 0（アニメなし）以外に指定した場合、
//        閉じアニメモードは自動的に変更されます。
//              0: アニメなし
//          1 - 7: フェードアウト
//
//        キャンセルした場合は決定アニメが行われないので、
//        指定された閉じアニメが実行されます。
//
// =============================================================
#SELBTN.CNT = 16			// ボタン選択肢の数
// -------------------------------------------------------------
#SELBTN.000.BASE_FILE = "_sentaku_base"        // ボタンのファイル名
;;#SELBTN.000.BACK_FILE = "_SEL_BTN00_BACK"   // 背景のファイル名
#SELBTN.000.BASE_POS = 960, 540             // ボタンの位置
#SELBTN.000.REP_POS = 0, 150                 // ボタンの修正位置
#SELBTN.000.ALIGN = 1, 1                    // ＸＹ方向の揃え位置（0=左／上、1=中央、2=右／下）
// -------------------------------------------------------------
#SELBTN.000.MOJI_SIZE = 44, 0, 0, 0         // 文字のサイズ、字間、行間、横文字数
#SELBTN.000.MOJI_POS = 600, 25              // 文字の位置
#SELBTN.000.MOJI_ALIGN = 1, 0               // 文字のＸＹ方向の揃え位置（0=左／上、1=中央、2=右／下）
#SELBTN.000.MOJI_COLOR = 0                  // 文字の色（■カラーテーブルの番号で指定）
#SELBTN.000.MOJI_HIT_COLOR = 5              // マウスが当たったときの文字の色（■カラーテーブルの番号で指定、-1=変更しない）
#SELBTN.000.BTN_ACTION = 3                  // ボタンアクション（■ボタンアクション番号で指定、-1:使わない）
