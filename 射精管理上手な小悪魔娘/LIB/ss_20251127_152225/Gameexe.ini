
// *************************************************************
// ■初期設定
// =============================================================
//		#DISCMARK		ディスク認識用のファイルです。
//						ここで指定したファイルを、ディスクに入れてください。
// =============================================================
#DISCMARK = "射精管理上手な小悪魔娘♪.env"         // ディスク認識ファイルのファイル名
#GAMENAME = "射精管理上手な小悪魔娘♪"              // キャプションなどに表示されるゲーム名
#GAMEVERSION = "ver 1.0"                // ゲーム名のバージョン情報（システムコマンドメニューや環境設定のバージョン情報の表示に使用されます。）
#MANUAL_PATH = ""                       // マニュアルへのパス（システムコマンドメニューのマニュアルから呼び出します。）
#SCREEN_SIZE = 1920, 1080                // スクリーンサイズ

// *************************************************************
// ■シーンの設定
// =============================================================
//		#START_SCENE	ゲーム開始時に呼ばれるシーンです。
//		#MENU_SCENE		システムコマンドメニューの「メニューに戻る」で呼ばれるシーンです。
//		#CANCEL_SCENE	キャンセルコール時に呼ばれるシーンです。
//		#CONFIG_SCENE	システムコマンドメニューの「環境設定」で呼ばれるシーンです。
//		#SAVE_SCENE		システムコマンドメニューの「セーブ」で呼ばれるシーンです。
//		#LOAD_SCENE		システムコマンドメニューの「ロード」で呼ばれるシーンです。
// =============================================================

#START_SCENE = "_start"                 // スタートシーン
#MENU_SCENE = "mesugaki_タイトル画面"                   // メニューシーン
#CANCEL_SCENE = "_quick_menu", 00			;; キャンセルシーン
#CONFIG_SCENE = "_config", 00				;; 環境設定シーン
#SAVE_SCENE   = "_save_load", 10			;; セーブシーン
#LOAD_SCENE   = "_save_load", 20			 ;; ロードシーン


// *************************************************************
// ■ダミーファイルチェック
// =============================================================
//  ダミーファイルのチェック時に表示される警告文です。
//  "\\n" で改行を行うことが出来ます。
//
//  ★プロテクト有りのゲームの場合、プロテクトの誤認識と区別する為、メッセージを工夫して下さい。
//    プロテクト有りの場合："「ゲーム名」のゲームディスクを入れてください。\\n\\n※プロテクトの誤認識ではありません。"
//    プロテクト無しの場合："「ゲーム名」のゲームディスクを入れてください。"
// =============================================================
#DUMMY_CHECK_STR    = "『射精管理上手な小悪魔娘♪』のディスクを入れてください。\\n\\n※プロテクトの誤認識ではありません。"
#DUMMY_CHECK_OK_STR = "『射精管理上手な小悪魔娘♪』をお買い上げいただき、ありがとうございます。"

// *************************************************************
// ■アイコンの設定
// =============================================================
//  各種カーソルを登録します。
//  ・マウスカーソル
//  ・キー待ちアイコン
//  ・選択肢アイコン
// =============================================================
#ICON.CNT = 16
;
// -------------------------------------------------------------
#ICON.000.FILE = "_keywait_icon"
#ICON.000.SPEED = 500
#ICON.000.CNT = 2






// *************************************************************
// ■マウスカーソルの登録
// =============================================================
//  マウスカーソルを登録します。
//
//  ≪画像の作り方≫
//      g00 のみ対応しています。
//      半透明の画像は使うことが出来ません。
//      不透明度が 255 のピクセルは完全に不透明に、そうでないピクセルは完全に透明になります。
//
//  ≪アニメーションの設定≫
//      指定した g00 画像にカット番号がある場合、カット番号の順にアニメーションします。
//      #MOUSE_CURSOR.000.SPEED = 100         // アニメスピード（ﾐﾘ秒で指定）
//
//  ≪ホットスポットの設定≫
//      ホットスポットとは、マウスカーソルの矢印の先端の座標です。
//      g00 画像の中心座標が使われます。
//
// =============================================================
#MOUSE_CURSOR.CNT = 6

// -------------------------------------------------------------
#MOUSE_CURSOR.000.FILE = "_mouse_cursor01"    // ファイル名
#MOUSE_CURSOR.000.SPEED = 0         // アニメスピード（ﾐﾘ秒で指定）



// *************************************************************
// ■マウスカーソルの設定
// =============================================================
//  標準で使うマウスカーソルの番号を指定します。
//  -1: Windows デフォルトのカーソル
// =============================================================
#MOUSE_CURSOR.DEFAULT = 0

// *************************************************************
// ■システムコマンドメニュー（右クリックメニュー）の設定
// =============================================================
// 無し／有り : 0=無し 1=有り （存在の有無）（★ゲームの起動時、及びタイトルメニューに戻った際の初期状態です。スクリプト命令で変更可能です）
// 無効／有効 : 0=無効 1=有効 （グレー表示）（★ゲームの起動時、及びタイトルメニューに戻った際の初期状態です。スクリプト命令で変更可能です）
//     文字列 : 項目の文字列
// =============================================================
#SYSCOMMENU.READ_SKIP   = 1, 1, "既読文章を早送り"    // 一度読んだ文章の早送りを開始します。
#SYSCOMMENU.UNREAD_SKIP = 1, 1, "文章を早送り"        // 未読の文章でも早送りを開始します。（★システム設定の「未読の文章も早送りできるようにする。」が有効の場合です）
#SYSCOMMENU.AUTO_SKIP   = 1, 1, "自動早送り"          // 自動早送り機能をＯＮ／ＯＦＦします。
#SYSCOMMENU.AUTO_MODE   = 1, 1, "オートモード"        // オートモードを開始します。
#SYSCOMMENU.HIDE_MWND   = 1, 1, "ウィンドウを消す"    // メッセージウィンドウを一時的に消去します。
// =============================================================
#SYSCOMMENU.SAVE        = 1, 1, "セーブ"              // セーブを呼び出します。（#SAVE_SCENE が設定されている場合は、そのシーンを呼び出します。設定されていない場合は、セーブダイアログを表示します）
#SYSCOMMENU.LOAD        = 1, 1, "ロード"              // ロードを呼び出します。（#LOAD_SCENE が設定されている場合は、そのシーンを呼び出します。設定されていない場合は、ロードダイアログを表示します）
#SYSCOMMENU.RETURN_SEL  = 1, 1, "前の選択肢に戻る"    // 前の選択肢に戻ります。
// =============================================================
#SYSCOMMENU.CONFIG      = 1, 1, "環境設定"            // 環境設定を呼び出します。（#CONFIG_SCENE が設定されている場合は、そのシーンを呼び出します。設定されていない場合は、環境設定ダイアログを表示します）
#SYSCOMMENU.MANUAL      = 1, 1, "マニュアルを開く"    // マニュアルを表示します。（マニュアルへのパスは #MANUAL_PATH で設定して下さい）
#SYSCOMMENU.VERSION     = 1, 1, "バージョン情報"      // バージョン情報を表示します。（情報は #GAMEVERSION で設定して下さい）
// =============================================================
#SYSCOMMENU.RETURN_MENU = 1, 1, "タイトルに戻る"      // タイトルメニューに戻ります。
#SYSCOMMENU.GAME_END    = 1, 1, "ゲームを終了する"    // ゲームを終了します。
#SYSCOMMENU.CANCEL      = 1, 1, "キャンセル"          // システムコマンドメニューをキャンセルします。

