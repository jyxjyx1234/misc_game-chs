#WAKU.OBJECT.CNT = 3    // オブジェクトの個数

// *************************************************************
// ■ウィンドウ枠個別の設定
// =============================================================
//
// ≪固定枠と可変枠≫
//     固定枠は、画像なし、またはカット１枚の画像が使えます。
//     可変枠は、カット１２枚の画像が使えます。
//
// ≪フィルター≫
//     フィルターは、画像または矩形を使うことが出来ます。
//
//     画像を使う場合は、ファイルを指定してください。
//         #WAKU.000.FILTER_FILE = "_mfilter00"           // フィルターのファイルを指定します。
//
//     矩形を使う場合は、マージンと色を指定してください。
//         #WAKU.000.FILTER_MARGIN = 0, 0, 0, 0           // フィルターをかける部分の矩形を、ウィンドウからのマージンで指定します。（左、上、右、下）
//         #WAKU.000.FILTER_COLOR = 0, 0, 0, 255          // フィルターの色を指定します。（ＲＧＢＡ）
//
//     実際は、これらに環境設定の「ウィンドウ背景」の色が加算されます。
//
// ≪顔グラについて≫
//     標準で４個まで設定できます。増やしたい場合は #MWND.FACE_CNT を設定してください。（▲枠の設定に移動予定）
//
// ≪ウィンドウボタン≫
//     ボタンは１６個までつけることができます。増やしたい場合は #MWND.FACE_CNT を設定してください。（▲枠の設定に移動予定）
//
//     ≪タイプ≫
//         ボタンの種類を指定します。
//
//         TYPE = "save"           // セーブボタン
//         TYPE = "load"           // ロードボタン
//         TYPE = "qsave", 0       // クイックセーブ（番号の指定が必要です。）
//         TYPE = "qload", 0       // クイックロード（番号の指定が必要です。）
//         TYPE = "read_skip", 0   // 既読早送りボタン（状態の指定が必要です。）
//         TYPE = "auto_mode", 0   // オートモードボタン（状態の指定が必要です。）
//         TYPE = "return_sel"     // 前の選択肢に戻るボタン
//         TYPE = "koe_play"       // 声再生ボタン
//         TYPE = "msg_log"        // メッセージログを開く
//         TYPE = "close_mwnd"     // メッセージウィンドウを閉じる
//         TYPE = "local_switch"   // ローカル汎用スイッチ
//         TYPE = "local_mode"     // ローカル汎用モード
//         TYPE = "global_switch"  // グローバル汎用スイッチ
//         TYPE = "global_mode"    // グローバル汎用モード
//
//     ≪モード≫
//         「既読早送り」や「オートモード」、「ローカル汎用スイッチ」は、
//         モードがＯＮ／ＯＦＦの２種類のボタンが必要です。
//         また、「ローカル汎用モード」は、モードの数だけボタンが必要です。
//
//         ≪例≫
//             #WAKU.000.BTN.000.TYPE = "read_skip", 0    // ボタン０番：既読早送りのモード０
//             #WAKU.000.BTN.001.TYPE = "read_skip", 1    // ボタン１番：既読早送りのモード１
//             #WAKU.000.BTN.002.TYPE = "switch", 0, 0    // ボタン２番：スイッチ０番のＯＦＦの状態
//             #WAKU.000.BTN.003.TYPE = "switch", 0, 1    // ボタン３番：スイッチ０番のＯＮの状態
//
//         ≪既読早送りボタンのモード≫
//             モード０：早送りがＯＦＦのときに使われるボタン（押すとＯＮになる）
//             モード１：早送りがＯＮのときに使われるボタン（押すとＯＦＦになる）
//
//         ≪オートモードボタンのモード≫
//             モード０：早送りがＯＦＦのときに使われるボタン（押すとＯＮになる）
//             モード１：早送りがＯＮのときに使われるボタン（押すとＯＦＦになる）
//
//         ≪ローカル汎用スイッチのモード≫
//             モード０：スイッチがＯＦＦのときに使われるボタン（押すとＯＮになる）
//             モード１：スイッチがＯＮのときに使われるボタン（押すとＯＦＦになる）
//
//         ≪ローカル汎用モードのモード≫
//             モード０：モードの値が０のときに使われるボタン（押すと値が１になる）
//             モード１：モードの値が１のときに使われるボタン（押すと値が２になる）
//             モード２：モードの値が２のときに使われるボタン（押すと値が３になる）
//             …
//
//     ≪キー待ちアイコン≫
//         メッセージのキー待ち中に表示されるアイコンです。（「■アイコンの設定」参照）
//
//     ≪アクション≫
//         ボタンアクションの番号を指定します。（「■ボタンアクションの設定」参照）
//
//     ≪効果音≫
//         ボタン効果音の番号を指定します。（「■ボタン効果音の設定」参照）
//
//     ≪コール≫
//         ボタンを押したときに、特定のシーンまたはコマンドをコールすることが出来ます。
//
//         ≪シーン名とＺラベルを指定する≫
//             #WAKU.000.BTN.000.CALL = "_system", 0        // _system.ss の #z00 をコールする
//             #WAKU.000.BTN.000.CALL = "_system", "$sys00" // _system.ss のコマンド "$sys00" をコールする
//
//         ≪注意点≫
//             コールを指定した場合、ボタンを押したときのデフォルトの動作は無効化されます。
//             例えば、セーブボタンを押してもセーブ画面は開きません。
//             状況に応じて、コール先で syscom.call_save_menu などの処理が必要です。
//
// =============================================================


